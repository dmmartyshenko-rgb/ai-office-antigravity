name: Deploy MiMo Bot to Vercel

on:
  workflow_dispatch:
    inputs:
      vercel_token:
        description: 'Vercel Token'
        required: true
      telegram_token:
        description: 'Telegram Token'
        required: true
      openrouter_key:
        description: 'OpenRouter Key'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mask secrets
        run: |
          echo "::add-mask::${{ inputs.vercel_token }}"
          echo "::add-mask::${{ inputs.telegram_token }}"
          echo "::add-mask::${{ inputs.openrouter_key }}"

      - uses: actions/checkout@v4
        with:
          ref: claude/xiaomi-code-install-9uxwre

      - name: Install Vercel CLI
        run: npm install -g vercel@latest --silent

      - name: Deploy (first pass — creates project)
        id: deploy1
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token }}
        run: |
          vercel --token "$VERCEL_TOKEN" --yes --prod 2>&1 | tee /tmp/deploy1.log
          PROJECT_ID=$(python3 -c "import json; print(json.load(open('.vercel/project.json'))['projectId'])")
          echo "project_id=$PROJECT_ID" >> $GITHUB_OUTPUT

      - name: Set environment variables
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token }}
          PROJECT_ID: ${{ steps.deploy1.outputs.project_id }}
          TELEGRAM_VAL: ${{ inputs.telegram_token }}
          OPENROUTER_VAL: ${{ inputs.openrouter_key }}
        run: |
          set_env() {
            curl -sf -X POST "https://api.vercel.com/v10/projects/$PROJECT_ID/env" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$1\",\"value\":\"$2\",\"type\":\"encrypted\",\"target\":[\"production\",\"preview\"]}" \
              && echo "Set $1" || echo "$1 may already exist, skipping"
          }
          set_env "TELEGRAM_BOT_TOKEN" "$TELEGRAM_VAL"
          set_env "OPENROUTER_API_KEY" "$OPENROUTER_VAL"

      - name: Redeploy with env vars
        id: deploy2
        env:
          VERCEL_TOKEN: ${{ inputs.vercel_token }}
        run: |
          OUTPUT=$(vercel --token "$VERCEL_TOKEN" --yes --prod 2>&1)
          echo "$OUTPUT"
          URL=$(echo "$OUTPUT" | grep -oE 'https://[a-z0-9._-]+\.vercel\.app' | tail -1)
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "Deploy URL: $URL"

      - name: Set Telegram webhook
        env:
          TELEGRAM_TOKEN: ${{ inputs.telegram_token }}
          DEPLOY_URL: ${{ steps.deploy2.outputs.url }}
        run: |
          RESP=$(curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/setWebhook?url=${DEPLOY_URL}/api/webhook")
          echo "Webhook: $RESP"
          echo
          echo "Bot live at: ${DEPLOY_URL}/api/webhook"
